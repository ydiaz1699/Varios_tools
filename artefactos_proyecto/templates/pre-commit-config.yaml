# .pre-commit-config.yaml — hooks que corren antes de cada commit.
# Instalar: pip install pre-commit && pre-commit install
# Probar todo: pre-commit run --all-files
# Framework: https://pre-commit.com

repos:
  # Fixers básicos (multi-lenguaje) — https://github.com/pre-commit/pre-commit-hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-added-large-files

