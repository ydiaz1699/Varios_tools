[project]
name = "sawers-mcp"
version = "0.1.0"
description = "MCP server para la tienda OpenCart de Sawers Bolivia (tienda.sawers.com.bo) por scraping. No hay API oficial."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ydiaz1699" }]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27",
    "selectolax>=0.3.21",
]

[project.scripts]
sawers-mcp = "sawers_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sawers_mcp"]
