; PlatformIO Configuration
; Consul CWH15AB ESP32 Controller
; 16 programas + encoder rotativo + LCD I2C

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Particion por defecto con OTA
board_build.partitions = default.csv

; Dependencias
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; Flags de compilacion
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
